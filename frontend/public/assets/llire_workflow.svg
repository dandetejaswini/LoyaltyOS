<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#343B40" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="sage-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DDEBE3"/>
    </linearGradient>
    <linearGradient id="blue-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DFEAF7"/>
    </linearGradient>
    <linearGradient id="lav-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAE2F4"/>
    </linearGradient>
    <linearGradient id="peach-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8E4DD"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="320" rx="16" fill="#F7F4EE" stroke="#E7E6E2" stroke-width="1.5"/>

  <!-- Connecting Path Line -->
  <path d="M 190 160 L 260 160 M 390 160 L 460 160 M 590 160 L 660 160" stroke="#747C83" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Arrows -->
  <polygon points="258,156 266,160 258,164" fill="#747C83"/>
  <polygon points="458,156 466,160 458,164" fill="#747C83"/>
  <polygon points="658,156 666,160 658,164" fill="#747C83"/>

  <!-- Step 1: Anomaly Detection -->
  <g transform="translate(60, 50)" filter="url(#soft-shadow)">
    <rect width="130" height="220" rx="12" fill="url(#peach-grad)" stroke="#E7E6E2" stroke-width="1.5"/>
    <rect x="15" y="20" width="32" height="32" rx="8" fill="#F3DFE6" stroke="#E7E6E2"/>
    <text x="31" y="42" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#343B40" text-anchor="middle">1</text>
    <text x="15" y="80" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#343B40">Detection</text>
    <text x="15" y="100" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#747C83">LLIRE Engine</text>
    <line x1="15" y1="112" x2="115" y2="112" stroke="#E7E6E2" stroke-width="1"/>
    <rect x="15" y="125" width="100" height="22" rx="4" fill="#FFFFFF" stroke="#E7E6E2"/>
    <text x="22" y="140" font-family="monospace" font-size="9" font-weight="bold" fill="#9E5B70">5 Invariant Rules</text>
    <text x="15" y="170" font-family="Inter, sans-serif" font-size="9" fill="#747C83">Scans balances,</text>
    <text x="15" y="184" font-family="Inter, sans-serif" font-size="9" fill="#747C83">returns, expiries</text>
    <text x="15" y="198" font-family="Inter, sans-serif" font-size="9" fill="#747C83">&amp; tier spend drift</text>
  </g>

  <!-- Step 2: Forensic Investigation -->
  <g transform="translate(260, 50)" filter="url(#soft-shadow)">
    <rect width="130" height="220" rx="12" fill="url(#blue-grad)" stroke="#E7E6E2" stroke-width="1.5"/>
    <rect x="15" y="20" width="32" height="32" rx="8" fill="#DFEAF7" stroke="#E7E6E2"/>
    <text x="31" y="42" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#343B40" text-anchor="middle">2</text>
    <text x="15" y="80" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#343B40">Investigation</text>
    <text x="15" y="100" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#747C83">Forensic Audit</text>
    <line x1="15" y1="112" x2="115" y2="112" stroke="#E7E6E2" stroke-width="1"/>
    <rect x="15" y="125" width="100" height="22" rx="4" fill="#FFFFFF" stroke="#E7E6E2"/>
    <text x="22" y="140" font-family="monospace" font-size="9" font-weight="bold" fill="#4F729E">7-Part Report</text>
    <text x="15" y="170" font-family="Inter, sans-serif" font-size="9" fill="#747C83">Root cause math,</text>
    <text x="15" y="184" font-family="Inter, sans-serif" font-size="9" fill="#747C83">auditable evidence</text>
    <text x="15" y="198" font-family="Inter, sans-serif" font-size="9" fill="#747C83">&amp; severity tiering</text>
  </g>

  <!-- Step 3: Dual-Key Governance -->
  <g transform="translate(460, 50)" filter="url(#soft-shadow)">
    <rect width="130" height="220" rx="12" fill="url(#lav-grad)" stroke="#E7E6E2" stroke-width="1.5"/>
    <rect x="15" y="20" width="32" height="32" rx="8" fill="#EAE2F4" stroke="#E7E6E2"/>
    <text x="31" y="42" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#343B40" text-anchor="middle">3</text>
    <text x="15" y="80" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#343B40">Dual-Key</text>
    <text x="15" y="100" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#747C83">Rule BR-09</text>
    <line x1="15" y1="112" x2="115" y2="112" stroke="#E7E6E2" stroke-width="1"/>
    <rect x="15" y="125" width="100" height="22" rx="4" fill="#FFFFFF" stroke="#E7E6E2"/>
    <text x="22" y="140" font-family="monospace" font-size="9" font-weight="bold" fill="#6B5885">Two Managers</text>
    <text x="15" y="170" font-family="Inter, sans-serif" font-size="9" fill="#747C83">Proposer &#8800; Reviewer</text>
    <text x="15" y="184" font-family="Inter, sans-serif" font-size="9" fill="#747C83">Enforced in RPC</text>
    <text x="15" y="198" font-family="Inter, sans-serif" font-size="9" fill="#747C83">Zero insider bypass</text>
  </g>

  <!-- Step 4: Ledger Reconciliation -->
  <g transform="translate(660, 50)" filter="url(#soft-shadow)">
    <rect width="170" height="220" rx="12" fill="url(#sage-grad)" stroke="#E7E6E2" stroke-width="1.5"/>
    <rect x="15" y="20" width="32" height="32" rx="8" fill="#DDEBE3" stroke="#E7E6E2"/>
    <text x="31" y="42" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#343B40" text-anchor="middle">4</text>
    <text x="15" y="80" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#343B40">Reconciliation</text>
    <text x="15" y="100" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#747C83">Compensating Entry</text>
    <line x1="15" y1="112" x2="155" y2="112" stroke="#E7E6E2" stroke-width="1"/>
    <rect x="15" y="125" width="140" height="22" rx="4" fill="#FFFFFF" stroke="#E7E6E2"/>
    <text x="22" y="140" font-family="monospace" font-size="9" font-weight="bold" fill="#628975">Balance = Journal = Lots</text>
    <text x="15" y="170" font-family="Inter, sans-serif" font-size="9" fill="#747C83">Posts immutable credit/debit,</text>
    <text x="15" y="184" font-family="Inter, sans-serif" font-size="9" fill="#747C83">reconciles 3-way balance,</text>
    <text x="15" y="198" font-family="Inter, sans-serif" font-size="9" fill="#747C83">closes case with audit event.</text>
  </g>
</svg>
